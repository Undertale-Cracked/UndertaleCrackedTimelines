<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undertale: Cracked Timelines</title>
    
    <!-- Importar a Fonte Pixelizada do Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <!-- Configuração para o Discord (Open Graph) -->
    <meta property="og:title" content="Undertale: Cracked Timelines">
    <meta property="og:description" content="Bem-vindo ao site oficial do servidor e da house!">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://github.io">
    <meta property="og:image" content="https://github.iobanner.png">
    <meta name="theme-color" content="#00ff66">

    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Press Start 2P', monospace;
            text-align: center;
            padding-top: 50px;
            line-height: 1.8;
        }
        
        h1 {
            color: #00ff66;
            font-size: 18px;
            margin-bottom: 20px;
            padding: 0 10px;
        }

p {
            font-size: 10px;
            color: #cccccc;
            margin-bottom: 35px;
            padding: 0 15px;
        }

        .container-botoes {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .botao {
            display: inline-block;
            background-color: #000000;
            color: #ffffff;
            padding: 15px 20px;
            text-decoration: none;
            border: 2px solid #00ff66;
            border-radius: 8px;
            font-weight: bold;
            font-size: 11px;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .botao:hover {
            background-color: #00ff66;
            color: #000000;
        }

        /* Estilo exclusivo para o botão do Pinterest */
        .botao-pinterest {
            border-color: #e60023;
        }

        .botao-pinterest:hover {
            background-color: #e60023;
            color: #ffffff;
        }

        /* Estilo exclusivo para o botão do YouTube */
        .botao-youtube {
            border-color: #ff0000;
        }

        .botao-youtube:hover {
            background-color: #ff0000;
            color: #ffffff;
        }

        /* Estilo exclusivo para o botão do Discord */
        .botao-discord {
            border-color: #5865F2;
        }

        .botao-discord:hover {
            background-color: #5865F2;
            color: #ffffff;
        }

        /* Regra exclusiva para telemóveis */
        @media (max-width:600px) {
            .botao {
                flex: 1 1 calc(50% - 15px);
                min-width: 140px;
                padding: 12px 5px;
                font-size: 9px; /* Evita que o texto pixelizado saia do botão */
            }
        }
    </style>
</head>
<body>

    <h1>Undertale: Cracked Timelines</h1>
    <p>Bem-vindo ao site oficial do servidor e da house!</p>
    
    <div class="container-botoes">
        <a class="botao" href="https://tiktok.com/@undertale.cracked" target="_blank">TikTok</a>
        <a class="botao botao-pinterest" href="https://pin.it/7bDlUqVki" target="_blank">Pinterest</a>
        <a class="botao botao-youtube" href="https://www.youtube.com/@UndertaleCracked" target="_blank">YouTube</a>
        <a class="botao botao-discord" href="https://discord.gg/wap8abJTPv" target="_blank">Discord</a>
    </div>

</body>
</html>
